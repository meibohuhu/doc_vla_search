name: qwen2.5-vl-3B-nuplan-nocot-sft-navtrain-navfiltturn40-vit-unfreeze-adamw8bit-brev
description: >
  no-CoT SFT 混训【nuPlan navtrain (101,288) + trainval_166k_navfilt_turn40 (19,322) = 120,610】，【ViT 解冻(全参) + optimizer=adamw8bit】 + LLM 全参。
  = qwen2.5-vl-3B-nuplan-nocot-sft-vit-unfreeze-adamw8bit-brev（navtest PDMS 84.22 那版的模型/超参，逐项不变）
  ⊕ 166k 按 navtest 口径过滤 + 转弯上调到 40% 的净新增集（对照 navfiltbal 的 33.6%；见 docs/0901/166k_vs_103k_distribution.md §6，
  构建脚本 scripts/0926/build_166k_navfilter.py）。混合后真停 1.3% / 转弯指令 40.0% / unknown 0%（navtest 33.6%，故意多给转弯）。
  本机(brev, 8xA100-SXM4-80G)，按【4 卡】设：global batch = 1 x 8 x 4 = 32。

# model —— 与 nocot-sft-vit-unfreeze-adamw8bit-brev 完全一致
model:
  use_cot: false                    # no-CoT
  pretrained_model_path: ./Qwen2.5-VL-3B-Instruct
  train_vision_backbone: true       # ViT 解冻
  train_lm_backbone: true           # LLM 全参（无 LoRA）
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  logger: wandb
  wandb_project: autovla-nocot-sft-vitunfreeze
  strategy: ddp
  # fp32 master weights —— 见 docs/0724/bf16_master_weights_bug.md。别关，否则 lr 更新被 bf16 舍入。
  fp32_master: true
  # 解冻 ViT 后 3.8B 全参单卡峰值 ~84.6G > 80G，8-bit AdamW 省 ~21G 优化器状态才塞得下
  optimizer: adamw8bit
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 6
  num_workers: 8
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null           # 用完整 120,610
  accumulate_grad_batches: 8        # 4卡: global batch = 1 x 8 x 4 = 32

data:
  # train 两个路径（SFTDataset 原生支持）；两边 JSON 都存绝对 camera 路径，sensor_data_path 都为 null。
  #   navfilt_turn40 链到 trainval_cot_166k(_val)，带 cot_output；use_cot=false 时忽略。
  #   与 navtrain / navtrain_val / navtest token 交集均为 0。
  train:
    json_dataset_path:
      - /data/autovla_data/nuplan/navtrain_nocot
      - /data/autovla_data/nuplan/trainval_166k_navfilt_turn40
    sensor_data_path:
      - null
      - null
  # val 与 84.22 那版相同，val_loss 可直接对比；navtest 留给最终 PDMS。
  val:
    json_dataset_path: /data/autovla_data/nuplan/navtrain_nocot_val
    sensor_data_path: null

inference:
  batch_size: 1
  num_workers: 4
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
