name: qwen2.5-vl-3B-nuplan-nocot-sft-navtrain
description: AutoVLA no-CoT SFT on nuPlan navtrain (~103k), ViT frozen + LLM full-param

# model
model:
  use_cot: false                    # no-CoT baseline
  pretrained_model_path: ./Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false      # original recipe: ViT frozen
  train_lm_backbone: true           # full-parameter LLM (no LoRA)
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

# training
training:
  logger: wandb
  wandb_project: autovla-nocot-sft
  strategy: ddp                     # model fits on one GPU; avoids FSDP all-gather over slow loopback NCCL
  batch_size: 2
  learning_rate: 2.0e-5
  epochs: 8
  num_workers: 8
  weight_decay: 0.01
  # ~103k samples / global batch 32 = ~3.2k optimizer steps per epoch, so a 500-step
  # warmup is ~15% of one epoch and the LR actually reaches 2e-5. (On navmini there
  # were only ~54 steps total, so the LR never left warmup -- see docs/721.)
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null           # use the full navtrain split
  accumulate_grad_batches: 8        # global batch = 2 x 8 x 2 GPU = 32, matches paper (1x4x8)

# Camera paths in the preprocessed JSONs are ABSOLUTE (the dataset yaml uses an
# absolute dataset_path), so sensor_data_path is null: SFTDataset uses the stored
# path as-is (sft_dataset.py:99-110).
#
# val is carved out of navtrain, NOT navtest -- navtest is reserved for the final
# PDMS benchmark, and selecting checkpoints on it would leak the test set.
data:
  train:
    json_dataset_path: /scratch/mh2803/vla/nuplan/navtrain_nocot
    sensor_data_path: null
  val:
    json_dataset_path: /scratch/mh2803/vla/nuplan/navtrain_nocot_val
    sensor_data_path: null

inference:
  batch_size: 1
  num_workers: 4
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
