name: qwen2.5-vl-3B-mix-nuplan103k-nuscenes-nocot-sft-vit-unfreeze-adamw8bit-tigris4n
description: >
  no-CoT SFT 混训【nuPlan navtrain (101,288) + nuScenes train (19,030) = 120,318】，【ViT 解冻(全参) + optimizer=adamw8bit】 + LLM 全参。
  = config/training/0926_nvidia/qwen2.5-vl-3B-mix-nuplan103k-nuscenes-nocot-sft-vit-unfreeze-adamw8bit-brev 的 tigris 版，
  模型/超参逐项不变，改: 模型路径、output_root、数据路径(/shared)、num_nodes，以及【val 只用 nuPlan】。
  tigris GH200 每节点 1 卡，按【4 节点】设：global batch = 1 x 8 x 4 = 32（与 brev 4 卡相同）。
  对照：0926_tiger 的 navtrain only / navfiltbal / navfiltturn40（同模型/超参，只换 train 数据）。

# model —— 与 0926_nvidia/...mix...-brev 完全一致（除 pretrained_model_path）
model:
  use_cot: false                    # no-CoT（nuScenes JSON 里 DriveLM 的 cot_output 被忽略）
  # [tigris] 模型放 /shared
  pretrained_model_path: /shared/rc/llm-gen-agent/mhu/auto_vla/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: true       # ViT 解冻
  train_lm_backbone: true           # LLM 全参（无 LoRA）
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"   # nuPlan 建的 codebook，nuScenes round-trip 0.078m 也适用
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  logger: wandb
  wandb_project: autovla-mix-nuplan-nuscenes-sft
  # [tigris] ckpt 放 /shared：实际路径 = <output_root>/sft/<启动时间戳>/
  output_root: /shared/rc/llm-gen-agent/mhu/auto_vla/runs
  strategy: ddp
  # fp32 master weights —— 见 docs/0724/bf16_master_weights_bug.md。别关，否则 lr 更新被 bf16 舍入。
  fp32_master: true
  # 保持 adamw8bit 以便和 brev / 0926_tiger 那几跑逐项可比
  optimizer: adamw8bit
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 6
  num_workers: 8
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null           # 用完整 120,318
  accumulate_grad_batches: 8        # 4 节点 x 1 卡: global batch = 1 x 8 x 4 = 32
  num_nodes: 4                      # 启动脚本还会用 AUTOVLA_NUM_NODES 覆盖成实际节点数

data:
  # train 两个路径（SFTDataset 原生支持）；两边 JSON 都存绝对 camera 路径（都在 /shared），sensor_data_path 为 null。
  #   ⚠️ 比例 101k:19k ≈ 5.3:1，nuScenes 仅占 ~16%，无上采样。
  train:
    json_dataset_path:
      - /shared/rc/llm-gen-agent/mhu/auto_vla/nuplan/navtrain_nocot
      - /shared/rc/llm-gen-agent/mhu/auto_vla/nuscenes/nuscenes_train
    sensor_data_path:
      - null
      - null
  # [tigris] val 只用 nuPlan（brev 版是 nuPlan + nuScenes 两边）：目标是 navtest PDMS，
  #   选 ckpt 不让 nuScenes val（5,569，占比会到 74%）主导 val_loss；也和 0926_tiger 几跑的 val 完全相同。
  val:
    json_dataset_path: /shared/rc/llm-gen-agent/mhu/auto_vla/nuplan/navtrain_nocot_val
    sensor_data_path: null

inference:
  batch_size: 1
  num_workers: 4
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
