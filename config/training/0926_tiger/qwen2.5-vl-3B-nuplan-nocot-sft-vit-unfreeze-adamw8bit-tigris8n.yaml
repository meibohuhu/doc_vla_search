name: qwen2.5-vl-3B-nuplan-nocot-sft-vit-unfreeze-adamw8bit-tigris8n
description: >
  no-CoT SFT on nuPlan【navtrain only (101,288)】，【ViT 解冻(全参) + optimizer=adamw8bit】 + LLM 全参。
  = config/training/0916_nvidia/qwen2.5-vl-3B-nuplan-nocot-sft-vit-unfreeze-adamw8bit-brev（navtest PDMS 84.22 那版）的 tigris 版，
  模型/超参逐项不变，只改: 模型路径、output_root、数据路径(/shared)、accum 8 -> 4。
  tigris GH200 每节点 1 卡，按【8 节点】设：global batch = 1 x 4 x 8 = 32（与 brev 4 卡 x 8 相同）。
  与 0926_tiger 的 navfiltbal / navfiltturn40 两跑对照：它们 = 本配置 ⊕ 166k 过滤净新增集。

# model —— 与 0916_nvidia/...vit-unfreeze-adamw8bit-brev 完全一致（除 pretrained_model_path）
model:
  use_cot: false                    # no-CoT
  # [tigris] 模型放 /shared（/home 配额紧，checkpoint 也在 /shared）
  pretrained_model_path: /shared/rc/llm-gen-agent/mhu/auto_vla/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: true       # ViT 解冻
  train_lm_backbone: true           # LLM 全参（无 LoRA）
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  logger: wandb
  wandb_project: autovla-nocot-sft  # 与 brev 84.22 那版同一个 project
  # [tigris] ckpt 放 /shared：实际路径 = <output_root>/sft/<启动时间戳>/
  output_root: /shared/rc/llm-gen-agent/mhu/auto_vla/runs
  strategy: ddp
  # fp32 master weights —— 见 docs/0724/bf16_master_weights_bug.md。别关，否则 lr 更新被 bf16 舍入。
  fp32_master: true
  # brev 上是为了塞进 80G 才用 8-bit AdamW；GH200 有 96G，普通 AdamW 可能也放得下，
  # 但保持 adamw8bit 以便和 brev 84.22 那版逐项可比。
  optimizer: adamw8bit
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 6
  num_workers: 8
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null           # 用完整 navtrain 101,288
  accumulate_grad_batches: 4        # 8 节点 x 1 卡: global batch = 1 x 4 x 8 = 32
  num_nodes: 8                      # 启动脚本还会用 AUTOVLA_NUM_NODES 覆盖成实际节点数

data:
  # JSON 存绝对 camera 路径（已用 scripts/0927/remap_camera_paths.py 改写到 /shared），sensor_data_path 为 null。
  # val 从 navtrain 切出，不用 navtest —— navtest 留给最终 PDMS。
  train:
    json_dataset_path: /shared/rc/llm-gen-agent/mhu/auto_vla/nuplan/navtrain_nocot
    sensor_data_path: null
  val:
    json_dataset_path: /shared/rc/llm-gen-agent/mhu/auto_vla/nuplan/navtrain_nocot_val
    sensor_data_path: null

inference:
  batch_size: 1
  num_workers: 4
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
