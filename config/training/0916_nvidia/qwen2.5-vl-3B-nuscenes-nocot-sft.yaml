name: qwen2.5-vl-3B-nuscenes-nocot-sft
description: "no-CoT SFT on nuScenes (train 19030 / val 5569), ViT frozen + LLM full-param.\n  数据为预处理好的 JSON（绝对 camera 路径，故 sensor_data_path=null）。\n  codebook round-trip 实测 nuScenes 均值 0.078m（<0.5m 红线），沿用\
  \ nuPlan 的 agent_vocab.pkl。\n  ⚠️ 评测不走 PDMS——nuScenes 用 L2+Collision（tools/eval/nusc_eval.py），需另备分割数据。"
model:
  use_cot: false
  pretrained_model_path: ./Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: codebook_cache/agent_vocab.pkl
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id:
    - 151644
    - 77091
  video:
    min_pixels: 109760
    max_pixels: 109760
training:
  logger: wandb
  wandb_project: autovla-nuscenes-sft
  strategy: ddp
  fp32_master: true
  batch_size: 1
  learning_rate: 2.0e-05
  epochs: 6
  num_workers: 8
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 8        # 4卡: global batch = 1 x 8 x 4 = 32，对齐论文
data:
  train:
    json_dataset_path: /data/autovla_data/nuscenes/nuscenes_train
    sensor_data_path: null
  val:
    json_dataset_path: /data/autovla_data/nuscenes/nuscenes_val
    sensor_data_path: null
inference:
  batch_size: 1
  num_workers: 4
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
