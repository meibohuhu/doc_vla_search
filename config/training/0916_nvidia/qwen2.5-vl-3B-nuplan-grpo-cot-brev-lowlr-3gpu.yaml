name: qwen2.5-vl-3B-nuplan-grpo-cot-brev-lowlr-3gpu
description: >
  GRPO on nuPlan/NAVSIM，CoT 基座 + LoRA。
  2026-09-02 重写:路径指向本机 /data，组改成【单帧 G 条 rollout】，
  strategy 换 DDP，reward = PDMS + 格式闸门（一致性只记录不进 reward）。
  背景与逐条理由见 docs/0806/vcrd_flow_autovla.md §5.4。

model:
  use_cot: true
  pretrained_model_path: ./Qwen2.5-VL-3B-Instruct
  # ⚠️ 必须填 CoT-SFT 的 ckpt（config/training/qwen2.5-vl-3B-nuplan-cot-sft-navtrain-brev.yaml
  #    跑出来那份）。填 no-CoT 的 ckpt 会让 rollout 根本说不出 <PLAN>，
  #    format 罚全程拉满、consistency 恒 0。
  sft_model_path: /home/nvidia/workspace/doc_drive_search/other_repo/AutoVLA/runs/sft/2026-09-02_05-47-39_bf16_cot_103k/epoch=4-loss=0.4436.ckpt
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  train_vision_backbone: false
  train_lm_backbone: true
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    r: 8
    alpha: 8
    dropout: 0.1
    bias: "none"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

data:
  # 🔴 先只在 navtest 上跑 —— navtrain 的 metric_cache 不存在，
  #    train token 查不到缓存 → rl_pdm_score 恒 0、teacher 也无从判。
  #    navtest_metric_cache 是完整的（12,146，与 navtest_cot 一一对应）。
  #    要在 navtrain 上正式训练，得先建 train metric_cache（见 flow §5.1）。
  train:
    # 🔴 5 万帧子集（从 navtrain_cot 的 101,288 里 seed=23 抽的）。
    #    配套的 scene_filter/navtrain50k.yaml 只列这 5 万个 token ——
    #    metric cache 只用建这些，比全量省一半时间。见 docs/0901/build_navtrain_metric_cache.md
    path: /data/autovla_data/nuplan/placeholder/trainval
    scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain50k.yaml
    # 预建好的全量 cache（HF: PhoenixHu/doc_vla_cache_train，103,288 个，34GB）
    # 覆盖 navtrain_cot / navtrain50k_cot / navtrain_cot_val 全部 token，缺 0。
    metric_cache_path: /data/autovla_data/nuplan/navtrain_metric_cache
    json_dataset_path: /data/autovla_data/nuplan/navtrain50k_cot
    sensor_data_path: null      # 样本里图片是绝对路径，不能再拼前缀
  val:
    path: /data/autovla_data/nuplan/placeholder/test
    scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest.yaml
    metric_cache_path: /data/autovla_data/nuplan/navtest_metric_cache
    json_dataset_path: /data/autovla_data/nuplan/navtest_cot
    sensor_data_path: null      # 样本里图片是绝对路径，不能再拼前缀

training:
  # ★ RL 必须用 DDP。FULL_SHARD 每层前向都 all-gather 参数，而 rollout 是逐 token
  #   自回归 —— 把 GRPO 里最贵的一步再放大一个量级。显存不是瓶颈（3B + 冻结 ref + LoRA）。
  #   见 flow §5.4 末节。
  strategy: ddp
  batch_size: 2                # 每卡每步 1 帧；组由 per_prompt_G 决定，不是 batch
  logger: wandb
  wandb_project: autovla-grpo-cot
  learning_rate: 1.0e-5
  epochs: 1
  num_workers: 1
  # 6 卡。实测 3 卡 × G=5 = 14.7 s/步；G=5→4 生成成本 ×0.8 → ~11.8 s/步，
  # 6 卡 = 6 帧/步 → 50,000/6 = 8,333 步 ≈ 27 小时（6 rank 的 straggler 同步可能到 30–33h）。
  # ⚠️ 与 SFT 不能共用卡；本机 GPU0 已坏，CUDA 编号 0-6
  devices: [0, 1, 2]
  sample:
    max_length: 2048
    temperature: 0.9
    top_k: 0.0
    top_p: 1.0

rl:
  kl_beta: 0.01
  dump_rollouts: true
  rollout_dump_dir: runs/grpo_rollouts/lowlr_3gpu

  group:
    # ★ 一帧采 G 条 rollout，组在【卡内】闭合，各卡拿不同帧。
    #   G 与 GPU 数彻底解耦（旧实现 G ≡ GPU 数，换卡数就换了算法）。
    #   设 1 = 退回旧的跨卡分组（只为复现旧实验）。
    per_prompt_G: 4

  reward:
    # R = w_pdm·PDMS − w_fmt·1[off-format]
    #
    # 🔴 缺的两项是 teacher 那半，等反事实剖面→可行集落地（flow §6.2/6.4/6.5）:
    #      − w_viol · 1[轨迹不可行]
    #      − w_say  · clip(Δ,0,c) · 1[i ∈ chg]
    #    在那之前这就是"PDMS + 格式闸门 + 自洽"的普通 GRPO，可以当基线跑。
    w_pdm: 1.0
    # 格式闸门:<think>/<answer>/<PLAN> 齐不齐、是否退化刷屏/中文。PDMS∈[0,1]，
    # w_fmt=1.0 意味着 off-format 亏掉整个 PDMS 量程 —— 这是硬闸门，故意压得重。
    # （取代原来的 cot_penalty:它靠 "complex scenario" 触发，新模板里 0/100222，已是死码。）
    w_fmt: 1.0
    # 🔴 一致性(说法↔轨迹)【不进 reward】，只作为指标 m_consistency 打到 wandb。
    #    写进 reward = 用手把 reasoning 和轨迹焊在一起，而"reasoning 变好 → 轨迹变好"
    #    正是本方法要论证的东西(paper §7)。焊完再测这条因果，测到的是自己加的那一项。
    sliding_window_size: 100
    scale: 10                  # 只影响 avg_train_reward 曲线量纲；组内标准化会把它约掉

  # ── teacher:判决 + Δ 定价（flow §6.4–6.5）────────────────────────────
  # 🔴 默认【关闭】。打开后 reward 追加两项:
  #       − w_viol · 1[触发]                     可行性罚
  #       − w_say  · clip(Δ,0,c) · 1[i ∈ chg]    说法的标价（进 reward，不是 loss）
  #    Δ = nll(z*) − nll(z)，只在 <PLAN> 的 SPEED 那个 span 上按 token 数归一 ——
  #    整句归一的话，改一个词的信号会被 ~60 个 token 稀释掉。
  teacher:
    enable: true
    # 🔴 trigger 默认 nc_only。navtest 600 帧实测（见 logs/0902/step0_gonogo.md）:
    #      NC=0 或 DAC=0（原始）                   触发 15.67%  chg 13.50%
    #      nc_only                                 触发  3.67%  chg  3.00%
    #      nc_or_deep_dac                          触发  7.67%  chg  6.83%
    #    69.5% 的触发是【纯横向失效】，沿学生路径改速度救不了 ——
    #    D 之所以非空只是因为"刹车让车在 4s 内走不到出界那一段"，是伪修复。
    #    nc_or_dac 只为复现原始行为保留，不建议用。
    trigger: nc_only            # nc_only | nc_or_deep_dac | nc_or_dac
    dac_depth_min: 0.3          # 仅 nc_or_deep_dac:出界深度阈值 (m)
    dac_time_max: 3.0           # 仅 nc_or_deep_dac:首次出界时刻上限 (s)
    # ── 权重按实测定标（navtest 80 帧 × G=5，ep2，见 logs/0902/step0_gonogo.md）──
    # Δ = nll(z*) − nll(z) 的分布:p50 +0.413  p95 +0.608  max +0.628  mean +0.340
    #                            Δ≤0（改写反而更自然，不罚）占 13.6%
    # 组内 PDMS 的 std 中位数 = 0.039  ← 语言项要和这个量级可比，不能盖过它
    #
    # 🔴 simlingo 搬来的 w_say=0.5 在这边太大:0.5 × 0.34 = 0.17，是组内 PDMS 跨度的
    #    4.5 倍，语言项会直接主导 advantage —— 那不是"给说法标价"，是让说法说了算。
    #    w_say=0.2 → 均罚 0.068，约 1.7× 组内 std，量级可比。
    w_say: 0.2
    # 🔴 clip_c=2.0（simlingo 的值）在这边**从不生效**:Δ 最大 0.628。
    #    收到 1.0 —— 仍然从不截断（保险丝），但不至于虚设。
    clip_c: 1.0
    # ⚠️ w_viol 的作用和 simlingo 那边不同:那边 reward 是 −ADE（负分），不加罚会让
    #    违规样本(0) 排在可行样本(−ADE) 之上，排序整个反掉。这边 PDMS∈[0,1]，
    #    不可行本来就拿 0、已经在组内垫底，w_viol 只是加大区分度，不是纠正排序。
    w_viol: 1.0

inference:
  batch_size: 1
  num_workers: 1
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0.0
    top_p: 1.0
