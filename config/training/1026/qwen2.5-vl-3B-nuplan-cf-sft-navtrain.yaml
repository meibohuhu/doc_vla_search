name: qwen2.5-vl-3B-nuplan-cf-sft-navtrain
description: >
  反事实指令 SFT（docs/1026/cf_sft_autovla_plan.md）。从 Qwen2.5-VL-3B 基座重新训，ViT 冻结 + LLM 全参。
  普通样本（75%）和 0916_nvidia/qwen2.5-vl-3B-nuplan-cot-sft-navtrain-brev 完全一样；
  cf 样本（25%）在 prompt 末尾加 "Scene report: … Suggested action: …."，答案只有 <PLAN> 和动作。
  ⚠️ 数据和图片路径现在是本机（gcis）的，cluster 上要改 data 段和 sensor_data_path。

model:
  use_cot: true
  cot_ratio: 0.75                   # 普通样本里 reason_then_act / act_directly 的比例，和 103k CoT 基线一样
  cot_in_prompt_ratio: 0.0
  # ── 反事实指令样本（§2、§4 C2）────────────────────────────────────────────
  cf:
    ratio: 0.25                     # 每条样本以这个概率换成 cf 样本
    decouple_ratio: 0.1             # cf 样本里，suggestion 换成别的动作、只训 action token 的比例
    # 照做样本的类别比例（KEEP 不当 suggestion，不能放这里）。换道的池子只有 ~2.9k 条，
    # 25% cf × 25% 换道 ≈ 每 epoch 6k 条，每条约重复 2 次。
    type_probs: {STOP: 0.25, DECELERATE: 0.25, ACCELERATE: 0.25, LANE_LEFT: 0.125, LANE_RIGHT: 0.125}
    # 解耦样本的类别比例；KEEP 只出现在这里
    decouple_type_probs: {STOP: 0.2, DECELERATE: 0.2, KEEP: 0.2, ACCELERATE: 0.2, LANE_LEFT: 0.1, LANE_RIGHT: 0.1}
  pretrained_model_path: ./Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false      # ViT 冻结，和 103k CoT 基线一样（§7 第 6 条）
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:                            # 训练现在也读这里（§4 C4），和推理一致
    min_pixels: 109760
    max_pixels: 109760

training:
  logger: wandb
  wandb_project: autovla-cf-sft
  strategy: ddp
  fp32_master: true                 # 不能关，见 docs/0724/bf16_master_weights_bug.md
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 6
  num_workers: 8
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  # global batch = batch_size × accum × GPU 数，保持 32（和 103k CoT 基线一致）。换 GPU 数要同步改。
  accumulate_grad_batches: 16       # 本机 2 卡；cluster 上按卡数改

data:
  train:
    json_dataset_path: /scratch/mh2803/vla/nuplan/navtrain_cot
    sensor_data_path: /scratch/mh2803/vla/nuplan/sensor_blobs     # navtrain_cot 的相机路径是相对路径
    cf_index: /scratch/mh2803/vla/nuplan/cf_navtrain_v1/cf_navtrain_v1_train.npz
  val:
    json_dataset_path: /scratch/mh2803/vla/nuplan/navtrain_cot_val
    sensor_data_path: /scratch/mh2803/vla/nuplan/sensor_blobs
    cf_index: /scratch/mh2803/vla/nuplan/cf_navtrain_v1/cf_navtrain_v1_val.npz

inference:
  batch_size: 1
  num_workers: 4
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
