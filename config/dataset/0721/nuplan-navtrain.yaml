name: nuplan-navtrain
description: nuPlan navtrain split 预处理（no-CoT），用于 AutoVLA SFT 训练

# processor 来源。no-CoT 路径下 processor 只用来拼一个最终被丢弃的字符串，
# 所以用 3B 即可，不需要 72B（那是 CoT 标注才要的）。
pretrained_model_path: ./Qwen2.5-VL-3B-Instruct

batch_size: 1
num_workers: 4          # 本机 8 核且被训练任务占用；配合 --fast 时这一步已不是瓶颈

# dataset_path 里的 "placeholder" 会被 nuplan_dataset.py 分别替换成
# navsim_logs / sensor_blobs，所以必须是 <root>/placeholder/<split> 的形式
#
# ⚠️ 必须用【绝对路径】。JSON 里存的 camera_path = sensor_blobs_path / data_path，
# 会原样带上这里的前缀。而 SFTDataset 之后还会再 os.path.join(sensor_data_path, camera_path)：
#   相对路径 -> 双重前缀，训练时全部找不到图
#   绝对路径 -> os.path.join 丢弃前缀，正确
dataset_name: nuplan
dataset_path: /data/autovla_data/nuplan/placeholder/trainval

# ⚠️ 必须用 navtrain.yaml，不要用 null（null 会 fallback 到 frame_interval=4 的密集切片，
# 那是 AutoVLA 论文 166.3k 的口径，需要完整 trainval 的 2TB sensor；
# 我们只下了 navtrain 的 445GB，配套的切法就是 navtrain.yaml -> 103,288 场景）
scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain.yaml
